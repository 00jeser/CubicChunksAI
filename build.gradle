tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

// The production jar must carry the javaheaders-linked core. Dev puts that jar on the
// classpath; a normal NeoForge install does not, and FML then throws NoClassDefFoundError
// for io.github.opencubicchunks.cc_core. Shading into this jar keeps one module. A nested
// jar would split the package. Header stubs (cc_core/minecraft) are not runtime classes.
// regionlib and noise stay off this jar: nothing in src/main or the linked core references
// them until E11 and E12.
tasks.named('jar', Jar).configure {
    dependsOn(configurations.coreHeaderJar, 'patchDasmNeoforge')
    inputs.files(configurations.coreHeaderJar)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(configurations.coreHeaderJar.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'io/github/opencubicchunks/cc_core/minecraft/**'
    }
}

// jarJar resolves the patched dasm file through the javaheaders transform. On a clean
// tree that file does not exist until patchDasmNeoforge runs.
tasks.configureEach {
    if (name == 'jarJar') {
        dependsOn('patchDasmNeoforge')
    }
}

// Force various tasks to run on intellij refresh
neoForge {
    ideSyncTask project("CubicChunksCore").getTasksByName("assemble", false)[0]
    ideSyncTask genAll
}
// Ensure we always genAll on any run
processResources.dependsOn(genAll, "CubicChunksCore:assemble")

// Force core to be built before the main project
compileJava.dependsOn("CubicChunksCore:assemble")

// Unzip CubicChunksCore tests beside the mod test classes. They are loaded from
// core-test-library; leaving them in the mod classes directory would split cc_core.
tasks.register('unzipTests', Copy) {
    outputs.upToDateWhen { false }
    dependsOn(configurations.named('extraTests'))
    from {
        def testsFile = configurations.extraTests.resolve().iterator().next()
        zipTree(testsFile)
    }
    exclude 'io/github/opencubicchunks/cc_core/minecraft/**'
    into(layout.buildDirectory.dir('core-unpacked-tests'))
}

tasks.named('unzipTests').configure {
    mustRunAfter 'cleanTest', 'compileTestJava'
}

// One gamelibrary jar: transformed core plus transformed core tests. Two jars would
// split cc_core packages under FancyModLoader, and loose class files are invisible to it.
tasks.register('coreTestLibrary', Jar) {
    dependsOn(configurations.coreHeaderJar, configurations.extraTests)
    // zipTree() inside from {} is not a task input, so a new header jar left this task UP-TO-DATE.
    inputs.files(configurations.coreHeaderJar, configurations.extraTests)
    archiveFileName.set('core-test-library.jar')
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'FMLModType': 'GAMELIBRARY'
    }
    from {
        zipTree(configurations.coreHeaderJar.singleFile)
    }
    from {
        zipTree(configurations.extraTests.singleFile)
    }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'io/github/opencubicchunks/cc_core/minecraft/**'
}

tasks.withType(Test).configureEach {
    // gradle docs suggest processors/2 which actually runs fractionally faster than just processors
    // forking a jvm is expensive.
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

test {
    minHeapSize = "512M"
    maxHeapSize = "2048M"

    dependsOn('unzipTests')
    useJUnitPlatform {
        excludeTags "longRunTest"
    }

    // Always run tests, even when nothing changed.
    dependsOn("cleanTest")

    // Show test results.
    testLogging {
        events("passed", "skipped", "failed")
    }

    // Mockito's Byte Buddy rejects class version 69 unless this flag is set.
    jvmArgs("-ea", "-Dmixin.debug.verbose=true", "-Dmixin.debug.export=true", "-Dmixin.checks.interfaces=true", "-Dnet.bytebuddy.experimental=true")
    exclude "**/mixin*"
}

// Core tests ship in core-test-library (FancyModLoader ignores loose class files).
// Mod tests compile against the mod classes. The NeoForge mod-folder provider loads
// src/main and src/test as one mod, so mixins apply and test classes are visible.
gradle.projectsEvaluated {
    tasks.named('compileTestJava', JavaCompile).configure {
        classpath = configurations.testCompileClasspath + sourceSets.main.output + configurations.extraTests
    }
    tasks.named('test', Test).configure {
        dependsOn('coreTestLibrary')
        classpath = files(tasks.named('coreTestLibrary', Jar).flatMap { it.archiveFile }) + configurations.testRuntimeClasspath.filter { File jar ->
            !jar.name.contains('CubicChunksCore')
        }
    }
}

