buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath("com.google.code.gson:gson:2.8.5")
        // javaheaders stays 1.2.8. plugins {} cannot force its transitive ASM,
        // and ASM 9.3 cannot read Java 25 class files (major 69).
        classpath("io.github.opencubicchunks:javaheaders:1.2.8")
    }
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.ow2.asm') {
                details.useVersion '9.9.1'
                details.because 'javaheaders 1.2.8 ASM 9.3 cannot read Java 25 class files (major 69)'
            }
        }
    }
}
plugins {
