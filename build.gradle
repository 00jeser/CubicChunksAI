    id("io.github.opencubicchunks.gradle.mixingen")
    id("io.github.opencubicchunks.gradle.dasmgen")
}

// javaheaders 1.2.8 stays the transformer. It is not applied as a plugin: Gradle's
// worker classpath exposes ASM 9.8, which rejects class major 69, and plugins {}
// cannot force the plugin's ASM. JavaHeadersLinkTransform loads ASM 9.9.1 first.
def javaHeadersLinked = Attribute.of('javaHeadersLinked', Boolean)
def javaHeadersArtifactType = Attribute.of('artifactType', String)
configurations.all {
    if (canBeResolved) {
        attributes.attribute(javaHeadersLinked, true)
    }
}
dependencies.attributesSchema.attribute(javaHeadersLinked)
dependencies.artifactTypes.jar.attributes.attribute(javaHeadersLinked, false)
dependencies.registerTransform(JavaHeadersLinkTransform) { spec ->
    spec.from.attribute(javaHeadersLinked, false).attribute(javaHeadersArtifactType, 'jar')
    spec.to.attribute(javaHeadersLinked, true).attribute(javaHeadersArtifactType, 'jar')
    spec.parameters.config.set(layout.projectDirectory.file('javaHeaders.json'))
    spec.parameters.acceptedJars.set('.*CubicChunksCore.*')
    spec.parameters.toolClasspath.from(buildscript.configurations.classpath.files.findAll { jar ->
        def n = jar.name
        (n.startsWith('asm-') || n.startsWith('javaheaders-') || n.startsWith('dasm-')
                || n.startsWith('guava-') || n.startsWith('failureaccess-')
                || n.startsWith('commons-lang3-') || n.startsWith('gson-2.9'))
    })
}

