def compileDasmPatch = tasks.register('compileDasmPatch', JavaCompile) {
    source = fileTree(dir: 'gradle/dasm-fml-patch', include: '**/*.java')
    classpath = configurations.dasmPatchCompile
    destinationDirectory = layout.buildDirectory.dir('dasm/classes')
    options.release.set(21)
    options.compilerArgs.add('-proc:none')
}

tasks.register('patchDasmNeoforge') {
    dependsOn compileDasmPatch
    def outFile = layout.buildDirectory.file('dasm/dasm-neoforge-3.2.0-fml.jar')
    inputs.files(configurations.dasmNeoforgeOriginal)
    inputs.dir(compileDasmPatch.flatMap { it.destinationDirectory })
    outputs.file(outFile)
    doLast {
        def dest = outFile.get().asFile
        dest.parentFile.mkdirs()
        java.nio.file.Files.copy(
                configurations.dasmNeoforgeOriginal.singleFile.toPath(),
                dest.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        ant.jar(update: true, destfile: dest) {
            fileset(dir: compileDasmPatch.get().destinationDirectory.get().asFile) {
                include(name: 'io/github/notstirred/dasm/mod/BaseConfigPlugin*.class')
            }
        }
    }
}

